[package]
name = "wechat-key-scan"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Windows-only local WeChat database key recovery"
license = "UNLICENSED"
publish = false

[dependencies]
wechat-core = { path = "../wechat-core" }
hex = { workspace = true }
thiserror = { workspace = true }
memchr = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
